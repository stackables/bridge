name: Code Coverage

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true

      - name: Install dependencies
        run: pnpm install
      - name: Run the tests
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          slug: stackables/bridge
