name: Test

permissions:
  contents: read

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install
      - name: Test
        run: pnpm test
      - name: Fuzz
        run: pnpm fuzz
      - name: Build
        run: pnpm build
      - name: Lint with ESLint
        run: pnpm lint
      - name: Knip
        run: pnpm knip
      - name: Knip (production)
        run: pnpm knip --production
