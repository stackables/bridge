name: Test

permissions:
  contents: read

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Install dependencies
        run: pnpm install
      - name: Test
        run: pnpm test
      - name: Fuzz
        run: pnpm fuzz
      - name: Build
        run: pnpm build
      - name: Lint with ESLint
        run: pnpm lint
      - name: Knip
        run: pnpm knip
      - name: Knip (production)
        run: pnpm knip --production
