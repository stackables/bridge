packages:
  - packages/*
  - examples/*

# bridge-core's tests import bridge-parser, which depends on bridge-core. pnpm 10 ran the tasks of such a cycle in
# an arbitrary order; pnpm 12 fails `pnpm -r` on it (ERR_PNPM_TASK_CYCLE) unless told to keep doing that.
ignoreWorkspaceCycles: true

# Only these dependencies run their install scripts (pnpm 11 and later read allowBuilds; onlyBuiltDependencies is gone).
allowBuilds:
  esbuild: true
  workerd: true

overrides:
  flatted@<=3.4.1: '>=3.4.2'
  graphql: 16.14.2
  lodash@>=4.0.0 <=4.17.22: '>=4.17.23'
  minimatch@<10.2.1: '>=10.2.1'
  minimatch@>=10.0.0 <10.2.3: '>=10.2.3'
  undici@>=7.0.0 <7.18.2: '>=7.18.2'
  undici@>=7.0.0 <7.24.0: '>=7.24.0'
  undici@>=7.17.0 <7.24.0: '>=7.24.0'
  wrangler@>=4.0.0 <4.59.1: '>=4.59.1'
  yaml@>=2.0.0 <2.8.3: '>=2.8.3'

# A release must be 7 days old before pnpm resolves it, also when Renovate refreshes the lockfile.
minimumReleaseAge: 10080

# The docs site's Cloudflare worker bundle resolves satteri to its WebAssembly binding.
supportedArchitectures:
  cpu:
    - current
    - wasm32
minimumReleaseAgeExclude:
  # Renovate security update: @graphql-tools/utils@13.1.3
  - "@graphql-tools/utils@13.1.3"
  # graphql-yoga 6 move (#182): these were under 7 days old on 2026-10-27. Exact versions only, newer releases still wait.
  - "@envelop/core@6.0.0"
  - "@envelop/instrumentation@2.0.0"
  - "@envelop/types@6.0.0"
  - "@graphql-tools/executor@4.1.2"
  - "@graphql-yoga/subscription@6.0.0"
  - "@graphql-yoga/typed-event-target@4.0.0"
  - "graphql-yoga@6.0.0"
